<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AirShield — Detect. Predict. Respond.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Devanagari:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5 4.5 5.6v5.6c0 4.8 3.1 8.9 7.5 10.3 4.4-1.4 7.5-5.5 7.5-10.3V5.6z"/><path d="M8.6 12.2h6.8M9.8 15.2h4.4"/></svg>
      </span>
      <div>
        <div class="brand-name">AirShield</div>
        <div class="brand-tag" data-i18n="tagline">Detect. Predict. Respond.</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="demo-flag">
      <strong>LIVE AIR QUALITY</strong><br>
      <span>District catalogue covers India; live AQI is shown only where a WAQI monitoring station is available.</span>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn hamburger" id="btnMenu" aria-label="Open navigation">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>

      <div class="searchbox">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
        <input type="text" id="citySearch" autocomplete="off" placeholder="Search city or location..." data-i18n-ph="searchPh" aria-label="Search city or location">
        <div id="suggestBox"></div>
      </div>

      <div class="spacer"></div>

      <button class="city-select" id="btnCity">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-5.4 7-11a7 7 0 1 0-14 0c0 5.6 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>
        <span id="cityLabel">Delhi</span>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
      </button>

      <div style="position:relative">
        <button class="icon-btn" id="btnLang" aria-label="Change language"><span style="font-size:.76rem;font-weight:600" id="langLabel">EN</span></button>
      </div>

      <button class="icon-btn" id="btnRefreshTop" aria-label="Refresh data" data-tip="refresh">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-1.9 6.1"/><path d="M20 20v-5h-5"/></svg>
      </button>

      <button class="icon-btn" id="btnNotif" aria-label="Notifications">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 6-2.5 7-2.5 7h17S18 14 18 8z"/><path d="M13.7 20a2 2 0 0 1-3.4 0"/></svg>
        <span class="dot" id="notifCount" hidden>0</span>
      </button>

      <div style="position:relative">
        <button class="icon-btn" id="btnProfile" aria-label="Profile menu" style="background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:.78rem">AM</button>
      </div>
    </header>

    <main class="content" id="view" tabindex="-1"></main>
  </div>
</div>

<button class="ai-fab" id="aiFab" aria-label="Open AirShield AI assistant">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v2.2M12 5.2a6.8 6.8 0 0 1 6.8 6.8v4.2a2.8 2.8 0 0 1-2.8 2.8H8a2.8 2.8 0 0 1-2.8-2.8V12A6.8 6.8 0 0 1 12 5.2z"/><path d="M9.3 12.4h.01M14.7 12.4h.01M9.6 16h4.8"/></svg>
</button>

<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="overlayRoot"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="js/core/app-core.js"></script>
<script src="data/india-districts.js"></script>
<script src="js/api/waqi.js"></script>
<script src="js/data/city-data.js"></script>
<script src="js/ui/shell.js"></script>
<script src="js/ui/charts-map.js"></script>
<script src="js/ui/shared-components.js"></script>
<script src="js/pages/dashboard.js"></script>
<script src="js/pages/map.js"></script>
<script src="js/pages/reports.js"></script>
<script src="js/pages/hotspots.js"></script>
<script src="js/pages/forecast.js"></script>
<script src="js/pages/analytics.js"></script>
<script src="js/pages/alerts.js"></script>
<script src="js/pages/infrastructure.js"></script>
<script src="js/pages/compare.js"></script>
<script src="js/pages/data-federation.js"></script>
<script src="js/pages/settings.js"></script>
<script src="js/ai/assistant.js"></script>
<script src="js/app.js"></script>
</body>
</html>
